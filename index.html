    </svg>
    <h1>Madden's on Gull Lake</h1>
    <p class="year">Summer 2026</p>
    <p id="subtitle">Sat July 25 – Wed July 29, 2026</p>
    <svg class="treeline" viewBox="0 0 1200 44" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#072a20" d="M0 44 L0 30
        L60 30 40 18 90 18 70 6 110 18 160 18 140 30 200 30

  <main>
    <nav class="pagenav">

    <div class="card">
      <div class="field">

        <select id="name-select" required>

  <footer>Check everything you'd like to do — pick as many as you want. 🌲</footer>
  <script src="config.js"></script>
